[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdomain-book-contracts"
version = "0.1.0"
description = "Pure-Python contracts shared across the pdomain-* OCR suite"
authors = [{ name = "CT", email = "concavetrillion@gmail.com" }]
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-core>=2.27,<3",
    "regex>=2024.11.6,<2025.0.0",
    "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.36,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pdomain_book_contracts"]

[tool.hatch.build.targets.sdist]
exclude = ["**/.venv", "**/.venv-container"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "ANN", "B", "BLE", "C4", "D", "E", "ERA", "F", "G", "I", "LOG", "N",
    "PERF", "PL", "PT", "RET", "RUF", "S", "SIM", "T20", "TC", "TID", "TRY",
    "UP", "W",
]
ignore = [
    "D100", "D104", "D105", "D107", "D203", "D205", "D212", "E501", "PLR2004",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "PLR2004", "S101", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["pdomain_book_contracts"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["pdomain_book_contracts", "tests"]
reportAny = "error"
reportExplicitAny = "error"
reportUnusedCallResult = "none"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
