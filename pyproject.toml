[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdomain-book-contracts"
version = "0.1.0"
description = "Pure-Python contracts shared across the pdomain-* OCR suite"
authors = [{ name = "CT", email = "concavetrillion@gmail.com" }]
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-core>=2.27,<3",
    "regex>=2024.11.6,<2025.0.0",
    "shapely>=2.0,<3",
    "typing-extensions>=4.12,<5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.36,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pdomain_book_contracts"]

[tool.hatch.build.targets.sdist]
exclude = ["**/.venv", "**/.venv-container"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint.flake8-type-checking]
# Missing from the Task 3 skeleton pyproject.toml; carried over from
# pdomain-book-tools' own identical setting (same path, contracts prefix),
# discovered landing Task 4 Step 2. CanonicalModel is a pydantic BaseModel
# subclass that other typography/matching/text models inherit from; without
# this, ruff's TC001/TC003 rules push their field-type imports (and stdlib
# collections.abc imports used the same way) into `TYPE_CHECKING`, which
# breaks pydantic's runtime schema construction under
# `from __future__ import annotations` — those imports must stay real.
runtime-evaluated-base-classes = [
    "pdomain_book_contracts.typography.spans.CanonicalModel",
    "pydantic.BaseModel",
]

[tool.ruff.lint]
select = [
    "ANN", "B", "BLE", "C4", "D", "E", "ERA", "F", "G", "I", "LOG", "N",
    "PERF", "PL", "PT", "RET", "RUF", "S", "SIM", "T20", "TC", "TID", "TRY",
    "UP", "W",
]
ignore = [
    "D100", "D104", "D105", "D107", "D203", "D205", "D212", "E501", "PLR2004",
    "TRY003",
    # Pylint complexity budget (too-many-arguments/branches/returns/statements):
    # pdomain-book-tools ignores these four repo-wide too, for the same
    # reason they recur here — discovered landing Task 4 Step 2, where
    # matching/engine.py, matching/legacy_projection.py, matching/models.py,
    # matching/pgdp_continuations.py, and typography/{exchange,records}.py
    # all carry functions past these thresholds. This package inherits that
    # complexity verbatim from the move; a reorganisation commit renames and
    # re-imports, it does not refactor function shapes.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    # PLC0415 (import-not-at-top-level): pdomain-book-tools ignores this
    # repo-wide for the same reason it recurs here — deferred imports break
    # circular deps and avoid loading optional-heavy modules until needed.
    # geometry/bounding_box.py defers a few stdlib imports (warnings, math,
    # json) inside individual methods to keep them out of the module's
    # always-paid import cost; its refine()/crop_top()/crop_bottom() no
    # longer import anything themselves — they dispatch through the
    # ImageOpsProvider registry instead, which is what keeps this package
    # free of an imaging-stack dependency, not a local import.
    "PLC0415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "PLR2004", "S101", "S108"]
# Legacy per-file exemptions carried over verbatim from pdomain-book-tools'
# own per-file-ignores for these two files (pre-dating its 2026-05-17
# strict-linting rollout), so the Task 4 Step 1 move commit can rewrite
# imports only and leave method bodies untouched. minX/minY/maxX/maxY
# (N802) and EPS (N806) are an existing public/local naming choice, not
# something a reorganisation commit may rename.
"pdomain_book_contracts/geometry/bounding_box.py" = ["D102", "N802"]
"pdomain_book_contracts/geometry/point.py" = ["D102", "N806"]
# Enum members are list-typed values; RUF012 incorrectly treats them as
# mutable class attributes. Carried over verbatim from pdomain-book-tools'
# own per-file-ignore for this file at its old path.
"pdomain_book_contracts/matching/character_groups.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["pdomain_book_contracts"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["pdomain_book_contracts", "tests"]
reportAny = "error"
reportExplicitAny = "error"
reportUnusedCallResult = "none"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
